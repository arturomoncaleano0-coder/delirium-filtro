<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro facial</title>
    <link rel="stylesheet" href="css/app.css">

    <!-- Los modulos de three.js (exportadores, etc.) importan "three" -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <video id="video-renderer"></video>
        <canvas id="canvas-renderer"></canvas>
        <button id="enable-audio" type="button">Activar sonido</button>
    </div>

    <script type="module">
        import { startFaceFilter } from "./js/mediapipe/mediapipe_controller.js";

        // Escena exportada desde el editor de three.js. Por defecto app.json;
        // para probar otra sin tocar el codigo: index.html?json=app_hulk.json
        const scene = new URLSearchParams(location.search).get("json") || "app.json";

        const filter = await startFaceFilter(scene);
        const audioButton = document.getElementById("enable-audio");

        audioButton.addEventListener("click", async () => {
            audioButton.disabled = true;
            audioButton.textContent = "Activando...";
            try {
                await filter.player.unlockAudio();
                audioButton.textContent = "Sonido activado";
                audioButton.classList.add("audio-enabled");
                window.setTimeout(() => audioButton.remove(), 1400);
            } catch (error) {
                console.error(error);
                audioButton.disabled = false;
                audioButton.textContent = "Reintentar sonido";
            }
        });
    </script>
</body>

</html>
